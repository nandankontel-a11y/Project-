<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Belman Store</title>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background: #f4f4f4; font-family: sans-serif; margin: 0;
        }
        .login-box { 
            background: white; padding: 30px; border-radius: 10px; 
            width: 90%; max-width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 12px; background: #ff4757; 
            color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
        }
        .footer { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>
        <!-- Ensure Shop1.html exists in the same folder -->
        <form action="Shop1.html">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="footer">
            <p>New user? <a href="signup.html">Sign up here</a></p>
        </div>
    </div>

</body>
</html>
