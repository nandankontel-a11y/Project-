<!DOCTYPE html>
<html>
<head>
    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        .hero { 
            height: 100vh; 
            /* Yahan apni image ka URL daalein */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('ibanner.png'); 
            background-size: cover; 
            background-position: center;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            text-align: center;
        }

        .navbar { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            padding: 30px 60px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        /* Updated Logo Color */
        .logo { 
            font-size: 32px; 
            font-weight: 800; 
            letter-spacing: 2px; 
            color: #FF5722; 
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Updated Nav Links */
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            margin-left: 30px; 
            font-size: 16px;
            text-transform: uppercase;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover { color: #FF5722; }

        /* Updated Button Styles */
        .btn { 
            padding: 18px 45px; 
            background: transparent; 
            border: 2px solid #FF5722; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            margin-top: 30px; 
            font-size: 18px;
            transition: 0.4s;
            font-weight: 600;
        }

        .btn:hover { 
            background: #FF5722; 
            box-shadow: 0 0 20px rgba(255, 87, 34, 0.6);
            color: white;
        }

        h1 { font-size: 65px; margin-bottom: 10px; font-weight: 800; }
        p { font-size: 20px; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="hero">
        <nav class="navbar">
            <div class="logo">BELMAN</div>
            <div class="nav-links">
                <a href="Login.html">Login</a>
                <a href="signup.html">Signup</a>
            </div>
        </nav>
        
        <h1>Step Into Style</h1>
        <p>Experience Belman's Crafted Comfort for Your Feet.</p>
        
        <a href="signup.html" class="btn">Explore Belman Collection</a>
    </div>

</body>
</html>
