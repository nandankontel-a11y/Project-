<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belman Store | Style & Comfort</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fdfdfd; min-height: 100vh; }
        
        /* Header */
        .header { background: white; padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; font-size: 22px; }
        .search-bar { width: 400px; padding: 12px; border: 1px solid #ddd; border-radius: 25px; background: #f9f9f9; }
        .nav-icons { display: flex; gap: 20px; font-weight: bold; cursor: pointer; }

        /* Slider */
        .slider { width: 100%; height: 50vh; background-size: cover; background-position: center; animation: slide 10s infinite; }
        @keyframes slide { 0%, 45% { background-image: url('Offer.png'); } 50%, 100% { background-image: url('Offer2.png'); } }

        /* Categories with Links */
        .cat-row { display: flex; justify-content: center; gap: 60px; padding: 40px 0; background: white; }
        .cat-item { text-align: center; cursor: pointer; transition: 0.3s; text-decoration: none; color: black; }
        .cat-item:hover { transform: scale(1.1); }
        .circle { width: 100px; height: 100px; border-radius: 50%; background-size: cover; background-position: center; border: 2px solid #eee; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); margin-bottom: 10px; }

        /* Trust Markers */
        .trust-markers { text-align: center; padding: 10px; font-size: 14px; color: #666; background: #fff; }

        /* Promo Section */
        .promo { background: #2d3436; color: white; margin: 20px 40px; padding: 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .get-app-btn { background: #ffd700; color: black; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .footer-note { text-align: center; font-size: 12px; color: #888; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Belman Store <span style="font-weight: 300;">| Style & Comfort</span></div>
        <input type="text" class="search-bar" placeholder="🔍 Search Belman Store...">
        <div class="nav-icons">
    <a href="contact.html">📞 Contact</a>
    <a href="cart.html">🛒 Cart (0)</a>
</div>

    </div>

    <div class="slider"></div>

    <div class="trust-markers">Free Shipping | Secure Payments | 24/7 Support</div>

    <div class="cat-row">
        <a href="sports.html" class="cat-item">
            <div class="circle" style="background-image: url('sports.jpeg');"></div>
            <p>Sports</p>
        </a>
        <a href="formal.html" class="cat-item">
            <div class="circle" style="background-image: url('formal.jpeg');"></div>
            <p>Formal</p>
        </a>
        <a href="casual.html" class="cat-item">
            <div class="circle" style="background-image: url('cat.jpeg');"></div>
            <p>Casual</p>
        </a>
        <a href="More.html" class="cat-item">
            <div class="circle" style="background-image: url('Shoes.jpg');"></div>
            <p>More</p>
        </a>
    </div>

    <div class="promo">
        <div>
            <span>Get Upto ₹200 off! Use code: <b>dboss</b></span><br>
            <span style="font-size: 14px; opacity: 0.8;">Offer ends in: 02:45:12</span>
        </div>
        <div class="get-app-btn">Get App Now</div>
    </div>

    <div class="footer-note">Belman Store | Innovated for the Future | Powered by [nandan]</div>

</body>
</html>
